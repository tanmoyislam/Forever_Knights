# Render blueprint (optional). Secrets are typed into the Render dashboard, never committed.
services:
  - type: web
    name: smartclass-api
    runtime: python
    rootDir: server
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /healthz
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: smartclass-db
          property: connectionString
      - key: DEVICE_TOKENS
        sync: false
      - key: ADMIN_TOKEN
        sync: false
databases:
  - name: smartclass-db
    plan: free
